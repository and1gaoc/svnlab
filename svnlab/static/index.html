<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#292961" />
    <title>SVNLab</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/commits" aria-label="SVNLab 提交记录">
        <span class="brand-mark" aria-hidden="true"><span>SVN</span></span>
        <span class="brand-name">SVNLab</span>
      </a>
      <form class="revision-search" id="revision-search" role="search">
        <label class="sr-only" for="revision-input">跳转到版本号</label>
        <span class="search-prefix">r</span>
        <input id="revision-input" inputmode="numeric" pattern="[0-9]+" placeholder="跳转到版本" autocomplete="off" />
        <kbd>Enter</kbd>
      </form>
      <div class="topbar-spacer"></div>
      <span class="connection-dot" id="connection-dot" aria-hidden="true"></span>
      <span class="connection-label" id="connection-label">尚未连接</span>
      <a class="topbar-button" href="#/settings" aria-label="仓库设置" title="仓库设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.4-2.2-1.7-1.3.1-1.1 1.5-1.5-1.8-3.1-2 .8-.9-.6-.3-2.1H9.7l-.3 2.1-.9.6-2-.8-1.8 3.1 1.5 1.5.1 1.1-1.7 1.3 1.8 3.1 2-.8.9.6.3 2.1h3.6l.3-2.1.9-.6 2 .8 1.8-3.1Z" /></svg>
      </a>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="project-identity">
          <span class="project-avatar" aria-hidden="true">S</span>
          <span class="project-copy"><strong id="project-name">SVN 仓库</strong><small>Subversion</small></span>
        </div>
        <nav class="project-nav" aria-label="项目导航">
          <a href="#/commits" data-nav="commits">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v12a4 4 0 0 0 4 4h6M7 7h8m0 0-3-3m3 3-3 3M7 17H3m0 0 3-3m-3 3 3 3" /></svg>
            <span>提交记录</span>
          </a>
          <a href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2m4 0h10M4 18h7m4 0h5M14 4v4M6 10v4m5 2v4" /></svg>
            <span>仓库设置</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <span>只读模式</span>
          <span class="readonly-badge">LOCAL</span>
        </div>
      </aside>

      <main id="view" class="main-view" tabindex="-1"></main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
